; Copy to chat2ftp.ini to pre-seed projects, or just create them in the app.
; One [project:NAME] section per project. Nothing here is required.

[general]
last_project = mysite

[project:mysite]
zip_dir = C:\Users\You\Downloads
work_dir = C:\chat2ftp\mysite
pattern = mysite-v*.zip
protocol = FTP
host = ftp.example.com
port = 21
user = myuser
password =
save_password = true
remote_root =
blocklist = inc/secrets.php

[project:client-shop]
zip_dir = C:\Users\You\Downloads
work_dir = C:\chat2ftp\client-shop
pattern = shop-v*.zip
protocol = SFTP
host = sftp.example.com
port = 22
user = deploy
password =
save_password = true
remote_root = /var/www/html
blocklist =
